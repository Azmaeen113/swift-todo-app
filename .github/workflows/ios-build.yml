name: Build iOS TodoApp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test on macOS
    runs-on: macos-14          # Apple Silicon Mac, Xcode 15 pre-installed

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Select Xcode version
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # 3. Write GoogleService-Info.plist from the repository secret
      #    Go to: GitHub repo → Settings → Secrets → Actions → New secret
      #    Name: GOOGLE_SERVICE_INFO_PLIST
      #    Value: paste the entire contents of your GoogleService-Info.plist
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          echo "$GOOGLE_SERVICE_INFO" > TodoApp/TodoApp/GoogleService-Info.plist

      # 4. Resolve Swift Package Manager dependencies
      - name: Resolve SPM Dependencies
        working-directory: TodoApp
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TodoApp.xcodeproj \
            -scheme TodoApp

      # 5. Build for simulator (no signing required)
      - name: Build for iOS Simulator
        working-directory: TodoApp
        run: |
          xcodebuild build \
            -project TodoApp.xcodeproj \
            -scheme TodoApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
